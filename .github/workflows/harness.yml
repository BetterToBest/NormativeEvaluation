name: harness
# Runs every reproducibility check and compares the whole run with the captured output.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every reproducibility check
        run: |
          set +e
          python3 run_all_checks.py > "$RUNNER_TEMP/harness_run.txt"
          status=$?
          cat "$RUNNER_TEMP/harness_run.txt"
          exit $status
      - name: Compare the whole run with the captured output
        run: cmp "$RUNNER_TEMP/harness_run.txt" run_all_checks_output.txt

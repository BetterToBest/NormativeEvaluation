name: land-session
# Lands a NEEC working session after the owner's review (decision W9, NEEC_Workflow_Package_s52.md; it replaces
# the push-triggered landing of decision 45.7). A session's last commit has a message beginning "NEEC Session <n>: "
# and adds NEEC_Project_Handoff_<n>.md; the session opens a pull request into main and the owner merges it. When a
# pull request into main is merged, this job reruns every reproducibility check on main and compares the run with
# the captured output; only if both pass does it tag each "NEEC Session <n>" commit the pull request carried s<n>
# (the last one at the merge commit, earlier stacked ones at their own commit), publish a release s<n> for each, and
# request a Pages build. A pull request with no session commit (for example a workflow change) is merged and
# checked but not tagged. Pushes made with GITHUB_TOKEN start no other workflow (GitHub's rule), so the harness on
# main is started explicitly.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of a merged pull request to (re)land"
        required: true
permissions:
  contents: write
  actions: write
  pages: write
  pull-requests: read
concurrency:
  group: land-session
  cancel-in-progress: false
jobs:
  land:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.inputs.pr || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every check on main
        run: |
          python3 run_all_checks.py > "$RUNNER_TEMP/run.txt"
          cmp "$RUNNER_TEMP/run.txt" run_all_checks_output.txt
      - name: Tag the session commits the pull request carried
        run: |
          merge=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.merge_commit_sha')
          head=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.sha')
          [ -n "$merge" ] && [ "$merge" != "null" ] || { echo "Pull request $PR is not merged"; exit 1; }
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR/commits" --jq '.[] | "\(.sha) \(.commit.message | split("\n")[0])"' > "$RUNNER_TEMP/commits.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tagged=0
          while read -r sha subject; do
            n=$(printf '%s' "$subject" | sed -nE 's/^NEEC Session ([0-9]+): .*/\1/p')
            [ -n "$n" ] || continue
            if git rev-parse -q --verify "refs/tags/s$n" > /dev/null; then echo "Tag s$n exists; skipped."; continue; fi
            git cat-file -e "$sha:NEEC_Project_Handoff_$n.md" || { echo "NEEC_Project_Handoff_$n.md missing at $sha"; exit 1; }
            target=$sha; [ "$sha" = "$head" ] && target=$merge
            git tag "s$n" "$target"
            git push origin "s$n"
            gh release create "s$n" --verify-tag --title "s$n" --notes "NEEC Session $n. Record: NEEC_Project_Handoff_$n.md. Pull request #$PR."
            tagged=$((tagged+1))
          done < "$RUNNER_TEMP/commits.txt"
          echo "Tagged $tagged session(s) from pull request #$PR."
      - name: Start the harness on main and request a Pages build
        run: |
          gh workflow run harness.yml --ref main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null 2>&1 || echo "Pages is not enabled; no build requested."
